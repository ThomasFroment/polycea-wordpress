name: "Helm Install"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Environment"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - prod
      region:
        description: "AWS Region"
        required: true
        default: "eu-west-3"
        type: string
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  TARGET_ENV: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'prod' }}
  TARGET_REGION: ${{ github.event_name == 'workflow_dispatch' && inputs.region || 'eu-west-3' }}

jobs:
  helm-lint:
    uses: ./.github/workflows/helm-lint.yml

  terraform-output:
    runs-on: ubuntu-latest
    outputs:
      eks_cluster_name: ${{ steps.terraform-output.outputs.eks_cluster_name }}
      rds_name: ${{ steps.terraform-output.outputs.rds_name }}
      rds_address: ${{ steps.terraform-output.outputs.rds_address }}
      k8s_namespace: ${{ steps.terraform-output.outputs.k8s_namespace }}
      helm_role_arn: ${{ steps.terraform-output.outputs.helm_role_arn }}

    steps:
      - uses: actions/checkout@v7

      - name: AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.TARGET_REGION }}

      - name: HashiCorp - Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.5"

      - name: Cache Terraform Providers
        uses: actions/cache@v6
        with:
          path: ./terraform/infra/.terraform/providers
          key: ${{ runner.os }}-terraform-${{ hashFiles('**/terraform/infra/.terraform.lock.hcl') }}

      - name: Terraform Init
        working-directory: ./terraform/infra
        run: terraform init

      - name: Terraform Workspace Select
        working-directory: ./terraform/infra
        run: |
          terraform workspace select ${{ env.TARGET_ENV }}

      - name: Terraform Output
        id: terraform-output
        working-directory: ./terraform/infra
        run: |
          echo "eks_cluster_name=$(terraform output -raw eks_cluster_name)" >> $GITHUB_OUTPUT
          echo "rds_name=$(terraform output -raw rds_name)" >> $GITHUB_OUTPUT
          echo "rds_address=$(terraform output -raw rds_address)" >> $GITHUB_OUTPUT
          echo "k8s_namespace=$(terraform output -raw k8s_namespace)" >> $GITHUB_OUTPUT
          echo "helm_role_arn=$(terraform output -raw helm_role_arn)" >> $GITHUB_OUTPUT

  helm-install:
    needs: [helm-lint, terraform-output]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ needs.terraform-output.outputs.helm_role_arn }}
          aws-region: ${{ env.TARGET_REGION }}

      - name: Install Helm
        uses: azure/setup-helm@v5
        id: install

      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig --name ${{ needs.terraform-output.outputs.eks_cluster_name }} --region ${{ env.TARGET_REGION }}

      - name: Install wordpress Helm Chart
        env:
          DB_HOST: ${{ needs.terraform-output.outputs.rds_address }}
          DB_NAME: ${{ needs.terraform-output.outputs.rds_name }}
          K8S_NAMESPACE: ${{ needs.terraform-output.outputs.k8s_namespace }}
        run: |
          helm upgrade --install wordpress ./helm/wordpress \
            --set db.host="$DB_HOST" \
            --set db.name="$DB_NAME" \
            --namespace "$K8S_NAMESPACE" \
            --rollback-on-failure \
            --wait