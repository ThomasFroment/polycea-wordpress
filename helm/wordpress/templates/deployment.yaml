apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        release: {{ .Release.Name }}
    spec:
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        env:
          - name: WORDPRESS_DB_HOST
            value: {{ .Values.db.host }}
          - name: WORDPRESS_DB_USER
            value: {{ .Values.db.user }}
          - name: WORDPRESS_DB_NAME
            value: {{ .Values.db.name }}
          - name: WORDPRESS_DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: "{{ .Release.Name }}-secret"
                key: WORDPRESS_DB_PASSWORD
        ports:
        - containerPort: {{ .Values.containerPort }}
        volumeMounts:
          - name: uploads
            mountPath: /var/www/html/wp-content/uploads
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
        readinessProbe:
          httpGet:
            path: /wp-login.php
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /license.txt
            port: http
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-pvc"