apiVersion: v1
kind: Service
metadata:
  name: "wordpress-service"
  namespace: polycea-wordpress
  labels:
    app: wordpress
    release: wordpress
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  selector:
    app: wordpress
    release: wordpress
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
