apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ .Release.Name }}-deployment"
  labels:
    app: {{ .Chart.Name }}
    release: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
        release: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.securityContext.runAsUser }}
        runAsGroup: {{ .Values.securityContext.runAsGroup }}
        fsGroup: {{ .Values.securityContext.fsGroup }}
        seccompProfile:
          type: RuntimeDefault

      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}@sha256:{{ .Values.image.digest }}"
        env:
          - name: WORDPRESS_DATABASE_HOST
            value: {{ .Values.db.host }}
          - name: WORDPRESS_DATABASE_NAME
            value: {{ .Values.db.name }}
          - name: WORDPRESS_DATABASE_USER
            valueFrom:
              secretKeyRef:
                name: rds-credentials
                key: username
          - name: WORDPRESS_DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                name: rds-credentials
                key: password
          # This is a dummy value. This should not be used in production.
          - name: WORDPRESS_PASSWORD
            value: "admin"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        ports:
        - name: http
          containerPort: {{ .Values.containerPort }}
        volumeMounts:
          - name: uploads
            mountPath: {{ .Values.mountPath }}
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /wp-login.php
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /license.txt
            port: http
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: "{{ .Release.Name }}-pvc"