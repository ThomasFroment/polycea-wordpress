name: "Helm Lint"

on:
  push:
  pull_request:

jobs:
  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint Helm Charts (storage-class)
        run: helm lint ./helm/storage-class

      - name: Lint Helm Charts (wordpress)
        run: helm lint ./helm/wordpress